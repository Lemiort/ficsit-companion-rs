<!DOCTYPE html>
<html>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />

<!-- Disable zooming: -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<head>
    <!-- change this to your project name -->
    <title>Ficsit Companion RS</title>

    <!-- config for our rust wasm binary. go to https://trunkrs.dev/assets/#rust for more customization -->
    <link data-trunk rel="rust" data-wasm-opt="2" />
    <!-- this is the base url relative to which other urls will be constructed. trunk will insert this from the public-url option -->
    <base data-trunk-public-url />

    <link data-trunk rel="icon" href="assets/favicon.ico">


    <link data-trunk rel="copy-file" href="assets/sw.js"/>
    <link data-trunk rel="copy-file" href="assets/manifest.json"/>
    <link data-trunk rel="copy-file" href="assets/icon-1024.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon-256.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/icon_ios_touch_192.png" data-target-path="assets"/>
    <link data-trunk rel="copy-file" href="assets/maskable_icon_x512.png" data-target-path="assets"/>

    <link data-trunk rel="copy-file" href="assets/satisfactory.json" data-target-path="assets"/>
    <link data-trunk rel="copy-dir" href="assets/icons/" data-target-path="assets"/>


    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="assets/icon_ios_touch_192.png">
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="white">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#404040">

    <style>
        html {
            /* Remove touch delay: */
            touch-action: manipulation;
        }

        body {
            /* Light mode background color for what is not covered by the egui canvas,
            or where the egui canvas is translucent. */
            background: #909090;
        }

        @media (prefers-color-scheme: dark) {
            body {
                /* Dark mode background color for what is not covered by the egui canvas,
                or where the egui canvas is translucent. */
                background: #404040;
            }
        }

        /* Allow canvas to fill entire web page: */
        html,
        body {
            overflow: hidden;
            margin: 0 !important;
            padding: 0 !important;
            height: 100%;
            width: 100%;
        }

        /* Make canvas fill remaining document below header: */
        canvas {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 3em; /* leave room for top bar */
            left: 0;
            width: 100%;
            height: calc(100% - 3em);
        }

        .centered {
            margin-right: auto;
            margin-left: auto;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f0f0f0;
            font-size: 24px;
            font-family: Ubuntu-Light, Helvetica, sans-serif;
            text-align: center;
        }

        /* ---------------------------------------------- */
        /* Loading animation from https://loading.io/css/ */
        .lds-dual-ring {
            display: inline-block;
            width: 24px;
            height: 24px;
        }

        .lds-dual-ring:after {
            content: " ";
            display: block;
            width: 24px;
            height: 24px;
            margin: 0px;
            border-radius: 50%;
            border: 3px solid #fff;
            border-color: #fff transparent #fff transparent;
            animation: lds-dual-ring 1.2s linear infinite;
        }

        @keyframes lds-dual-ring {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Top header similar to emscripten shell */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3em;
            background-color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 0;
        }

        .side {
            display: flex;
            align-items: center;
        }

        .icon {
            height: 2.2em;
            padding: 0.5em 0.5em;
        }

        .app-name {
            color: white;
            font-size: 1.05rem;
            margin: 0;
        }

        .tip {
            color: white;
                height: 3em;
                max-width: 50%;
        }

        svg { padding: 0.5em 0.5em; }

        body { padding-top: 3em; }
    </style>
</head>

<body>

    <div class="top-bar" role="banner">
        <div class="side">
            <img src="assets/icon-256.png" alt="App icon" class="icon">
            <h1 class="app-name">Ficsit Companion</h1>
        </div>

        </div>
        <div class="side">

    <!-- The WASM code will resize the canvas dynamically -->
    <!-- the id is hardcoded in main.rs . so, make sure both match. -->
    <canvas id="the_canvas_id"></canvas>

    <!-- the loading spinner will be removed in main.rs -->
    <div class="centered" id="loading_text">
        <noscript>You need javascript to use this website</noscript>
        <p style="font-size:16px">
            Loading…
        </p>
        <div class="lds-dual-ring"></div>
    </div>

    <!--Register Service Worker. this will cache the wasm / js scripts for offline use (for PWA functionality). -->
    <!-- Force refresh (Ctrl + F5) to load the latest files instead of cached files  -->
    <script>
        // We disable caching during development so that we always view the latest version.
        if ('serviceWorker' in navigator && window.location.hash !== "#dev") {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js');
            });
        }
    </script>

    <script>
        const tips = [
            "You can freely move nodes using Alt",
            "You can nudge selected nodes using keyboard arrows",
            "You can select multiple nodes using Ctrl+left click",
            "You can group the currently selected nodes using Ctrl+G",
            "You can unpack a selected node group using Ctrl+G",
            "You can focus on the current graph using F",
            "You can delete a node using delete",
            "You can select all nodes using Ctrl+A",
            "A link between two pins will be displayed in red if both ends are not equal",
            "A splitter node will be displayed in red if its outputs sum don't match its input",
            "A merger node will be displayed in red if its inputs sum don't match its output",
            "A group node will be displayed in red if some of its internal nodes were not loaded properly from a file",
            "There are two kinds of splitters: one for which all outputs are equal, and one for which they are independent",
            "An invalid link for a sink will be displayed in orange",
            "You can set values using complex expressions such as (7.2 - 4.8) + 2 / (4/3 - 1/3)",
            "You can track your build progress by clicking the checkbox on the top right corner of craft nodes",
            "A craft node marked as built will be displayed with a green border",
            "If an update is impossible due to a pin going to negative value, it will be displayed in red",
            "You can lock or unlock a pin using Right Click",
            "You can lock or unlock a full node using Right Click",
            "A purple rate means it's currently locked",
            "The current graph is automatically saved on exit",
            "Pins can't be locked inside a group node, but a full group node can be locked",
            "You can duplicate all selected nodes using Ctrl + D",
            "You can quickly find a given recipe in a graph by clicking on it on the left panel",
            "You can quickly find a given item in a graph by clicking on it on the left panel",
        ];

        function updateTip() {
            const el = document.getElementById('tip');
            if (!el) return;
            el.textContent = "Tip: " + tips[Math.floor(Math.random() * tips.length)];
            // Also set native title for full tooltip on hover
            el.title = el.textContent;
        }
        updateTip();
        setInterval(updateTip, 60000);
    </script>
</body>
